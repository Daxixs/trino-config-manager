<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trino Config Manager — Вход</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d0f12;
            color: #c9d1e0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-wrap {
            width: 360px;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            color: #3b82f6;
            letter-spacing: 0.05em;
        }
        .login-logo p { color: #4a5568; font-size: 12px; margin-top: 4px; }
        .login-card {
            background: #13161b;
            border: 1px solid #252a34;
            border-radius: 10px;
            padding: 28px;
        }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 12px; color: #7a8599; margin-bottom: 6px; font-weight: 500; }
        input {
            width: 100%;
            background: #0d0f12;
            border: 1px solid #252a34;
            border-radius: 6px;
            color: #c9d1e0;
            font-size: 14px;
            padding: 10px 14px;
            outline: none;
            font-family: 'JetBrains Mono', monospace;
            transition: border-color 0.15s;
        }
        input:focus { border-color: #3b82f6; }
        .btn-login {
            width: 100%;
            padding: 11px;
            background: #3b82f6;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            font-family: 'Inter', sans-serif;
        }
        .btn-login:hover { background: #1d4ed8; }
        .error-msg {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-logo">
            <h1>⬡ TRINO MANAGER</h1>
            <p>Configuration Control Panel</p>
        </div>
        <div class="login-card">
            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}
            <form method="post" action="/login">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" name="username" autofocus placeholder="admin">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-login">Войти</button>
            </form>
        </div>
    </div>
</body>
</html>
